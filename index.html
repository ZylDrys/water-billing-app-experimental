<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Billing Application</title>
    <style>
        body { font-family: Arial, sans-serif; }
        /* Add your styles here */
    </style>
</head>
<body>
    <h1>Water Billing Application</h1>
    <section id="billing">
        <label for="waterUsage">Water Usage (m<sup>3</sup>): </label>
        <input type="number" id="waterUsage" />
        <label for="rate">Rate (currency): </label>
        <input type="number" id="rate" />
        <button onclick="updateStats()">Calculate</button>
    </section>
    <section id="stats" style="display: none;">
        <h2>Billing Stats</h2>
        <p id="totalBill"></p>
    </section>
    <script>
        let currencySymbol = "$";

        function showSection(sectionId) {
            const sections = ["billing", "stats"];
            sections.forEach(id => {
                document.getElementById(id).style.display = id === sectionId ? "block" : "none";
            });
        }

        function updateStats() {
            const waterUsage = document.getElementById('waterUsage').value;
            const rate = document.getElementById('rate').value;
            const totalBill = waterUsage * rate;
            document.getElementById('totalBill').innerText = `Total Bill: ${currencySymbol}${totalBill}`;
            showSection('stats');
        }

        // Initial call to show billing section
        showSection('billing');
    </script>
</body>
</html>
